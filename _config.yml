title: "Earth Memory Studio"
description: "Полевой дневник исследовательской команды. Научно-популярный архив знаний."
url: "https://iurlov-debug.github.io"
baseurl: ""

# Коллекции — обязательно для генерации страниц
collections:
  characters:
    output: true
    permalink: /characters/:path/
  episodes:
    output: true
    permalink: /episodes/:path/

# Тема отключена — используем кастомные layout
theme: null

# Плагины (GitHub Pages поддерживает эти)
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Настройки Markdown
markdown: kramdown
highlighter: rouge

# Время и язык
timezone: Europe/Moscow
lang: ru
