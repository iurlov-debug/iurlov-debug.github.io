---
layout: default
---

<article class="character-page">
  <div class="container">
    <nav class="breadcrumb">
      <a href="{{ '/' | relative_url }}">← Команда</a>
    </nav>

    <header class="character-header" style="--char-color: {{ page.color }}">
      <span class="character-emoji">{{ page.emoji }}</span>
      <h1>{{ page.name }}</h1>
      <p class="character-role">{{ page.role }}</p>
      <p class="character-title">{{ page.title }}</p>
    </header>

    <div class="character-content">
      {{ content }}
    </div>
  </div>
</article>
