<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

        <nav class="main-nav">

          <a href="{{ '/characters/archivist/' | relative_url }}">Архив</a>

        </nav>
      </div>
    </header>

    <main class="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>«Разные мысли. Разные знания. Одна цель — понять мир.»</p>
      <p class="footer-copy">Earth Memory Studio © 2026</p>
