# Earth Memory Archive — Полевой дневник команды
title: "Earth Memory Studio"
description: "Архив знаний исследовательской команды"
baseurl: ""
url: "https://yourusername.github.io"

plugins:
  - jekyll-feed
  - jekyll-sitemap

# ============================================================
# КОЛЛЕКЦИИ — обязательно для генерации страниц
# ============================================================
collections:
  characters:
    output: true
    permalink: /characters/:path/
  episodes:
    output: true
    permalink: /episodes/:path/

# Шаблоны по умолчанию
defaults:
  - scope:
      path: ""
      type: "characters"
    values:
      layout: "character"
  - scope:
      path: ""
      type: "episodes"
    values:
      layout: "episode"

# Минимальная тема (встроена в GitHub Pages)
theme: minima
